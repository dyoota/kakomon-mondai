<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="750" height="720" viewBox="0 0 750 720">
  <foreignObject x="0" y="0" width="750" height="720">
    <html xmlns="http://www.w3.org/1999/xhtml">
      <head>
        <meta charset="UTF-8"/>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&amp;family=Montserrat:wght@800;900&amp;display=swap"/>
        <style><![CDATA[
          *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
          body{width:750px;height:720px;overflow:hidden;background:#0f172a;padding:48px 40px;}
          h3{font-family:'Montserrat',sans-serif;font-size:24px;color:#fde047;margin-bottom:28px;text-align:center;letter-spacing:0.05em;}
          .lead{font-size:15px;color:#cbd5e1;font-family:'Noto Sans JP','Hiragino Sans',sans-serif;margin-bottom:28px;line-height:1.8;}
          ul{list-style:none;padding:0;margin-bottom:28px;}
          li{position:relative;padding-left:32px;margin-bottom:16px;font-family:'Noto Sans JP','Hiragino Sans',sans-serif;font-size:14px;font-weight:700;color:#fff;line-height:1.65;}
          li::before{content:'✓';position:absolute;left:0;top:-1px;color:#2563eb;font-size:18px;font-weight:900;}
          strong{color:#fde047;}
          .imgs{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
          .img-wrap{border-radius:6px;overflow:hidden;border:1px solid #334155;background:#1e293b;}
          .img-wrap img{width:100%;display:block;}
          .img-label{font-family:'Noto Sans JP','Hiragino Sans',sans-serif;font-size:11px;color:#64748b;padding:8px 12px;text-align:center;}
        ]]></style>
      </head>
      <body>
        <h3>RESULT : アーキテクチャがもたらした「現実」</h3>
        <p class="lead">この構造を完成させ、私が実践した結果がこれです。</p>
        <ul>
          <li><strong>海外リプで4k（4,000）インプ超え：</strong> 国内の競合を避け、海外インフルエンサーにスポットライトを当ててもらう戦術で、フォロワー15人の無名アカウントが一気に認知を獲得。</li>
          <li><strong>交流リプによる優良フォロワー獲得：</strong> 闇雲なポスト量産をやめ、インフルエンサーとその先の読者を狙った「二重褒めリプ」に徹した結果、質の高いフォロー（購買層）へ直結。</li>
          <li><strong>商品パッケージの自動生成：</strong> AIに「富永流ペルソナ設計」を含んだマスタープロンプトを投げるだけで、複産物まで完璧に計算された構成案が数分で完成。</li>
        </ul>
        <div class="imgs">
          <div class="img-wrap">
            <img src="analytics1.png" alt="Xアナリティクス ダッシュボード"/>
            <div class="img-label">アカウント全体の推移（インプレッション・フォロー）</div>
          </div>
          <div class="img-wrap">
            <img src="analytics2.png" alt="ポストアナリティクス詳細"/>
            <div class="img-label">交流リプによる優良ポスト（4.1K imp・52いいね）</div>
          </div>
        </div>
      </body>
    </html>
  </foreignObject>
</svg>
