<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="750" height="640" viewBox="0 0 750 640">
  <foreignObject x="0" y="0" width="750" height="640">
    <html xmlns="http://www.w3.org/1999/xhtml">
      <head>
        <meta charset="UTF-8"/>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&amp;family=Montserrat:wght@800;900&amp;display=swap"/>
        <style><![CDATA[
          *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
          body{width:750px;height:640px;overflow:hidden;background:#0f172a;}
          .card{padding:48px 40px;text-align:center;border:2px solid #2563eb;height:100%;position:relative;overflow:hidden;}
          .badge{position:absolute;top:24px;right:-40px;background:#ef4444;color:#fff;font-family:'Noto Sans JP',sans-serif;font-size:13px;font-weight:900;padding:6px 52px;transform:rotate(45deg);letter-spacing:0.08em;}
          h2{font-family:'Montserrat',sans-serif;font-size:22px;color:#fde047;margin-bottom:8px;}
          .sub{font-family:'Noto Sans JP','Hiragino Sans',sans-serif;font-weight:900;font-size:18px;color:#fff;margin-bottom:10px;}
          .desc{font-family:'Noto Sans JP','Hiragino Sans',sans-serif;font-size:14px;color:#cbd5e1;line-height:1.8;margin-bottom:24px;}
          .history{background:rgba(255,255,255,0.05);border-radius:8px;padding:20px;margin-bottom:16px;text-align:left;}
          .history ul{list-style:none;padding:0;}
          .history li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed rgba(255,255,255,0.1);font-family:'Noto Sans JP','Hiragino Sans',sans-serif;font-size:14px;color:#cbd5e1;}
          .history li:last-child{border-bottom:none;}
          .history li.active{color:#fde047;font-weight:900;font-size:16px;}
          .price{font-family:'Montserrat',sans-serif;font-size:72px;font-weight:900;color:#fde047;line-height:1;margin:16px 0 8px;}
          .price span{font-size:36px;}
          .notice{font-family:'Noto Sans JP','Hiragino Sans',sans-serif;font-size:12px;color:#64748b;margin-bottom:16px;line-height:1.8;}
          .cta{background:rgba(37,99,235,0.2);border:2px dashed #2563eb;border-radius:8px;padding:18px 24px;}
          .cta p{font-family:'Noto Sans JP','Hiragino Sans',sans-serif;font-size:17px;font-weight:900;color:#fff;line-height:1.6;}
          .cta span{color:#fde047;}
          .arrow{display:block;font-size:28px;color:#fde047;margin-top:6px;}
        ]]></style>
      </head>
      <body>
        <div class="card">
          <div class="badge">部数限定</div>
          <h2>THE ARCHITECTURE</h2>
          <p class="sub">あなたの思考を「売れる完成品」に圧縮する設計図</p>
          <p class="desc">
            このプロンプト一式があれば、あなたは高単価なnoteを無限に生み出せます。<br/>
            目標100部に向けて情報を都度更新。今買えば、今後追加されるノウハウも<br/>
            <strong style="color:#fff;">全て追加費用なしで手に入ります。</strong>
          </p>
          <div class="history">
            <ul>
              <li class="active"><span>【現在】先着30部限定価格</span><span>2,980円</span></li>
              <li><span>【次回】31部〜</span><span>4,980円に値上げ予定</span></li>
              <li><span>【今後】部数到達に応じて</span><span>段階的値上がり予定</span></li>
            </ul>
          </div>
          <div class="price"><span>¥</span>2,980</div>
          <p class="notice">
            ※30部売れた時点で自動的に4,980円に値上げします。<br/>
            ※返金設定はOFFです。「読み物」ではなく「実装」を求める方のみご購入ください。
          </p>
          <div class="cta">
            <p>▼ ご購入は、このすぐ下にある<br/><span>「記事を購入する」ボタン</span> から ▼</p>
            <span class="arrow">⬇︎</span>
          </div>
        </div>
      </body>
    </html>
  </foreignObject>
</svg>
