<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ExamMaster AI ポータル</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050816;
      color: #e5e7eb;
    }
    header {
      padding: 16px 24px;
      border-bottom: 1px solid #1f2933;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-size: 20px;
      margin: 0;
    }
    header a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 14px;
    }
    main {
      height: calc(100vh - 57px); /* headerぶん引く */
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>ExamMaster AI</h1>
    <a href="https://ai.studio/apps/drive/ここを自分のURLに変える" target="_blank">
      AI Studio で開く ↗
    </a>
  </header>
  <main>
    <iframe
      src="https://ai.studio/apps/drive/ここを自分のURLに変える"
      allow="clipboard-write; clipboard-read; microphone;">
    </iframe>
  </main>
</body>
</html>
